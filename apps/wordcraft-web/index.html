<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2b579a">
  <title>WordCraft · Izhaan Intellect Office</title>
  <link data-trunk rel="icon" href="../../assets/app-icon/wordcraft.ico" />
  <link data-trunk rel="rust" data-bin="wordcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      width: 100dvw;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #e6e6e6;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    #wordcraft_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #wordcraft_loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #374151;
      font: 14px system-ui, -apple-system, sans-serif;
      pointer-events: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(43, 87, 154, 0.18);
      border-top-color: #2b579a;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #back_to_portal {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      background: rgba(17, 24, 39, 0.85);
      color: #f8fafc;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 6px 14px;
      font: 500 12px system-ui, -apple-system, sans-serif;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    #back_to_portal:hover {
      background: rgba(17, 24, 39, 0.95);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }
    @media (max-width: 600px) {
      #back_to_portal {
        bottom: 8px;
        right: 8px;
        padding: 4px 10px;
        font-size: 11px;
        opacity: 0.85;
      }
    }
  </style>
  <script>
    (function() {
      const origFetch = window.fetch;
      window.fetch = async function(...args) {
        const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url);
        if (url && url.includes('.wasm')) {
          const barContainer = document.getElementById('loading_progress_bar_container');
          const bar = document.getElementById('loading_progress_bar');
          const status = document.getElementById('loading_status');
          if (barContainer) barContainer.style.display = 'block';

          const response = await origFetch.apply(this, args);
          if (!response.ok) return response;

          const contentLength = response.headers.get('content-length');
          const total = contentLength ? parseInt(contentLength, 10) : 0;
          let loaded = 0;

          const reader = response.body.getReader();
          const stream = new ReadableStream({
            async start(controller) {
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                loaded += value.byteLength;
                if (total > 0) {
                  const pct = Math.min(100, Math.round((loaded / total) * 100));
                  if (bar) bar.style.width = pct + '%';
                  if (status) status.innerText = pct + '% (' + (loaded / (1024 * 1024)).toFixed(1) + ' MB / ' + (total / (1024 * 1024)).toFixed(1) + ' MB)';
                } else {
                  if (status) status.innerText = (loaded / (1024 * 1024)).toFixed(1) + ' MB downloaded';
                }
                controller.enqueue(value);
              }
              if (status) status.innerText = 'Starting engine...';
              controller.close();
            }
          });

          return new Response(stream, {
            headers: response.headers,
            status: response.status,
            statusText: response.statusText,
          });
        }
        return origFetch.apply(this, args);
      };
    })();
  </script>
</head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading">
    <div class="spinner"></div>
    <div id="loading_title" style="font-weight: 600; font-size: 15px; margin-top: 14px; color: #111827;">Loading WordCraft&hellip;</div>
    <div id="loading_progress_bar_container" style="width: 220px; height: 5px; background: #e5e7eb; border-radius: 999px; margin-top: 12px; overflow: hidden; display: none;">
      <div id="loading_progress_bar" style="width: 0%; height: 100%; background: #2b579a; border-radius: 999px; transition: width 0.15s ease;"></div>
    </div>
    <div id="loading_status" style="font-size: 12px; color: #6b7280; margin-top: 6px;"></div>
  </div>
  <a href="https://office.izhaanintellect.fun" id="back_to_portal">
    <span style="color: #60a5fa; font-weight: bold;">←</span> Office Portal
  </a>
</body>
</html>
